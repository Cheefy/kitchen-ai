services:
  # Postgres and llama.cpp are NOT services here -- both run as standalone
  # Unraid Community Applications containers, not inside this Compose stack:
  #   - postgres:18, published on host port 5433 (5432 already taken by
  #     the existing paperless-ai Postgres)
  #   - ghcr.io/ggml-org/llama.cpp:server-vulkan, published on host port
  #     8081, GPU-passthrough'd to the Arc Pro B70 via /dev/dri
  # `backend` reaches both over the LAN via env vars in .env, not via
  # Compose-internal DNS, since they're outside this project's network.
  # See kitchen_ai_spec.md §2.

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    ports:
      # Host 8000 is already claimed by PortainerCE on this box.
      - "8001:8000"
